#endereço do banco de dados 
spring.datasource.url=jdbc:mysql://localhost:3306/techos

#usuario do banco de dados 
spring.datasource.username=root
#senha do banco d dados 
spring.datasource.password=

#update:o Spring JPA ira atualizar o banco de dados automaticamente com base nas entidades definidas
spring.jpa.hibernate.ddl-auto=update

#mostrar o terminal sql gerado pelo hibernate
spring.jpa.show-sql=true
